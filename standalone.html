<!doctype html>
<meta charset="utf-8">
<title>MapGAN Standalone</title>
<style>
html,body{height:100%;margin:0;background:#0b121c;display:grid;place-items:center}
canvas{width:min(100vw,1024px);height:auto;display:block}
</style>
<canvas id="c" width="1024" height="512"></canvas>
<script>
const bias=.260839;
const blobs=[
[-60.6354,-57.881,38.8218,19.3016,1.589944,1.6219],
[30.6816,-76.0643,16.1669,70,-2.486348,-2.901],
[-152.9286,77.6722,36.8674,9.7845,1.809129,-.8618],
[94.023,20.6782,84.1732,19.2055,-.849666,2.1282],
[-134.736,-65.7177,53.9297,55.0841,-2.395976,-2.64],
[178.8743,-11.8674,62.038,18.8331,-1.140758,-1.3774],
[170.4464,-25.8526,8.6785,70,.735525,-1.896],
[-42.4561,-73.8317,10.0366,34.8745,-3.027641,-1.6001],
[-162.454,20.8565,21.497,17.3479,-.487141,-2.2365],
[85.783,81,8.6805,29.0618,1.8849,-1.0837],
[-101.252,66.4762,95,53.4303,-1.252703,.2991],
[173.5774,45.3221,45.6907,35.3599,-1.447852,1.0033],
[-25.1191,57.6413,8.6988,27.4531,-.502635,-2.0177],
[179.7132,-60.0292,5.8317,54.8744,1.926442,-2.3048],
[168.1418,22.2619,7.5978,39.866,3.096946,-1.423],
[-119.5735,-49.0439,54.2248,23.957,-2.17418,-.346],
[99.0175,-59.7011,72.9129,18.2029,-1.302719,-2.4121],
[61.0466,55.4281,38.017,3.9289,1.718077,-.7823],
[110.9145,38.4121,76.2393,19.5292,-1.103818,.4741],
[-4.3205,-27.7036,8.7664,17.1726,2.753102,-1.5074],
[-115.2926,-18.2278,46.6497,23.108,1.494827,.3035],
[44.9646,-36.5144,75.9477,12.9876,-2.502724,-1.5127],
[7.7797,-27.7194,37.9349,13.6585,-.601493,1.4071],
[-16.3001,-66.8892,57.132,30.5292,-3.107223,1.077]
].map(b=>[...b,Math.cos(b[4]),Math.sin(b[4])]);

const canvas=document.getElementById("c");
const w=canvas.width,h=canvas.height;
const ctx=canvas.getContext("2d");
const img=ctx.createImageData(w,h);
const px=img.data;

for(let y=0,p=0;y<h;y++){
  const lat=90-(y+.5)*180/h;
  const cosLat=Math.cos(lat*Math.PI/180);
  for(let x=0;x<w;x++,p+=4){
    const lon=(x+.5)*360/w-180;
    let field=bias;
    for(const b of blobs){
      let dx=((lon-b[0]+540)%360)-180;
      dx*=cosLat;
      const dy=lat-b[1];
      const xr=b[6]*dx+b[7]*dy;
      const yr=-b[7]*dx+b[6]*dy;
      field+=b[5]*Math.exp(-.5*((xr/b[2])**2+(yr/b[3])**2));
    }
    const land=field>0;
    px[p]=land?242:11;
    px[p+1]=land?242:18;
    px[p+2]=land?242:28;
    px[p+3]=255;
  }
}

ctx.putImageData(img,0,0);
</script>
